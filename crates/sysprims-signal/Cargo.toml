[package]
name = "sysprims-signal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = true
description = "Signal dispatch and process group management"
documentation = "https://docs.rs/sysprims-signal"
readme = "README.md"

[features]
default = []
# Enables tests that require root and container isolation (broadcast signal tests)
privileged-tests = []
# Enables tests that require multiple user accounts (permission tests)
cross-user-tests = []

[dependencies]
sysprims-core.workspace = true
rsfulmen = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
