name: Go Bindings Windows ARM64 (Spike)
# Spike workflow to validate aarch64-pc-windows-gnullvm + llvm-mingw as the
# build path for Windows arm64 Go bindings. Isolated from the real
# go-bindings.yml pipeline so it cannot affect releases. Remove or fold into
# go-bindings.yml once proven.
#
# Tracking: supersedes the "not supported" note in ADR-0012 / platform-support.md.

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows-arm64-gnu:
    name: Build sysprims-ffi (aarch64-pc-windows-gnullvm)
    runs-on: windows-latest-arm64-s
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw (aarch64 ucrt)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest' -Headers @{ 'User-Agent' = 'sysprims-spike' }
          Write-Host "llvm-mingw release: $($release.tag_name)"
          $asset = $release.assets | Where-Object { $_.name -like '*ucrt-aarch64.zip' } | Select-Object -First 1
          if (-not $asset) { throw "No ucrt-aarch64 asset found in llvm-mingw latest release" }
          Write-Host "Downloading: $($asset.name) ($([math]::Round($asset.size/1MB,1)) MB)"
          $zipPath = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath -UseBasicParsing
          $extractRoot = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force
          $binDir = Get-ChildItem -Path $extractRoot -Directory | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'bin' }
          if (-not (Test-Path $binDir)) { throw "llvm-mingw bin directory not found at $binDir" }
          Write-Host "llvm-mingw bin: $binDir"
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          # Sanity: show the aarch64 clang driver
          & "$binDir\aarch64-w64-mingw32-clang.exe" --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-gnullvm

      - name: Rust / cargo sanity
        shell: pwsh
        run: |
          rustc --version --verbose
          rustup target list --installed
          cargo --version

      - name: Build sysprims-ffi
        shell: pwsh
        run: cargo build --release --target aarch64-pc-windows-gnullvm -p sysprims-ffi

      - name: Inspect build output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = 'target/aarch64-pc-windows-gnullvm/release'
          Write-Host "Contents of $outDir :"
          Get-ChildItem $outDir | Where-Object { $_.Name -like 'sysprims_ffi*' -or $_.Name -like 'libsysprims_ffi*' } | Format-Table Name, Length
          $staticLib = Join-Path $outDir 'libsysprims_ffi.a'
          if (-not (Test-Path $staticLib)) { throw "libsysprims_ffi.a not produced at $staticLib" }
          Write-Host "Static lib size: $((Get-Item $staticLib).Length) bytes"
          # Confirm it's an aarch64 archive via llvm-ar
          & llvm-ar.exe t $staticLib | Select-Object -First 5

      - name: Package FFI artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/ffi/windows-arm64 | Out-Null
          Copy-Item target/aarch64-pc-windows-gnullvm/release/libsysprims_ffi.a dist/ffi/windows-arm64/

      - name: Upload FFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffi-windows-arm64-gnu-spike
          path: dist/ffi/windows-arm64
