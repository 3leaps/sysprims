name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # Pinned llvm-mingw release tag for Windows arm64 GNU toolchain. Bump here
  # and in go-bindings.yml / release.yml together when advancing. See
  # docs/standards/platform-support.md for toolchain policy.
  LLVM_MINGW_VERSION: '20260407'
  CBINDGEN_VERSION: '0.29.2'
  GOVULNCHECK_VERSION: 'v1.9.0'
  GOSEC_VERSION: 'v2.29.0'
permissions:
  contents: read
jobs:
  format:
    name: Format Check
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc@sha256:616a4b5361d2cf7d32ac32496d58e9c288660d5606f0a27efdbf56e3a462ab2d
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Check formatting through Goneat DX
        run: make fmt-check
  lint:
    name: Clippy
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.1  # pin:rust=stable
          components: clippy
      - name: Run Clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path bindings/python/Cargo.toml -- -D warnings
  planning-hygiene:
    name: Planning Reference Guard
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: No private planning-plane references in tracked files
        run: bash scripts/check-planning-hygiene.sh
      - name: No local paths, keys, tokens or commit markers in tracked files
        run: python3 -I -B scripts/content-check.py
      - name: Install PyYAML
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q python3-yaml
          python3 -P -E -c 'import yaml'
      - name: Workflow digest pins and read-only permissions
        run: |
          python3 -B -E scripts/release-workflow-pin.py check
          python3 -B -P -E scripts/ci-pins.py check
      - name: npm trusted publishing runtime guard
        run: bash scripts/check-npm-trusted-publish-runtime.sh
  release-tooling:
    name: Release Tooling Controls
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Verify tooling prerequisites
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          command -v gpg git node
      - name: Install minisign and PyYAML
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q minisign python3-yaml
          minisign -v
          python3 -P -E -c 'import yaml'
      - name: Install checksum-pinned decernor
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/decernor.XXXXXX")"
          archive="$(awk '{print $2}' config/release/decernor-ci-sha256.txt)"
          tag="v$(sed -E 's/^decernor_([0-9.]+)_linux_amd64\.tar\.gz$/\1/' <<<"$archive")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/3leaps/decernor/releases/download/${tag}/${archive}" \
            --output "$tool_dir/$archive"
          (cd "$tool_dir" && sha256sum --check "$GITHUB_WORKSPACE/config/release/decernor-ci-sha256.txt")
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" decernor
          echo "SYSPRIMS_DECERNOR_BIN=$tool_dir/decernor" >> "$GITHUB_ENV"
      - name: Synthetic release-tooling controls
        run: make release-tooling-test
  typescript-api-drift:
    name: TypeScript API Drift
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: bindings/typescript/sysprims/package-lock.json
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88.0  # pin:rust=msrv
      - name: Install pinned cbindgen
        run: cargo install cbindgen --version ${{ env.CBINDGEN_VERSION }} --locked
      - name: Install TypeScript tooling
        working-directory: bindings/typescript/sysprims
        run: npm ci --ignore-scripts
      - name: Generate current C header
        run: cbindgen --config cbindgen.toml --crate sysprims-ffi --output "${RUNNER_TEMP}/sysprims.h"
      - name: Check capability, export, and documentation drift
        working-directory: bindings/typescript/sysprims
        env:
          SYSPRIMS_C_HEADER: ${{ runner.temp }}/sysprims.h
        run: npm run api:check
  windows-cross-check:
    name: Windows Cross-Target Check (no SDK)
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.1  # pin:rust=stable
          targets: x86_64-pc-windows-msvc,x86_64-pc-windows-gnu,aarch64-pc-windows-msvc
      # cargo check does type checking only (no linking), so this works without the Windows SDK.
      # This is a fast guardrail for Windows-only compile errors.
      - name: cargo check (windows msvc x64)
        run: cargo check --workspace --exclude sysprims-ts-napi --target x86_64-pc-windows-msvc
      - name: cargo check (windows gnu x64)
        run: cargo check --workspace --exclude sysprims-ts-napi --target x86_64-pc-windows-gnu
      - name: cargo check (windows msvc arm64)
        run: cargo check --workspace --exclude sysprims-ts-napi --target aarch64-pc-windows-msvc
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # pin:runner=linux-x64
            target: x86_64-unknown-linux-gnu
          - os: macos-15  # pin:runner=macos-arm64
            target: aarch64-apple-darwin
          - os: windows-2025  # pin:runner=windows-x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest-arm64-s
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.1  # pin:rust=stable
          targets: ${{ matrix.target }}
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Run FFI smoke tests
        run: cargo test -p sysprims-ffi
  # Port bindings invariant tests (self-listener discoverable)
  # Windows runs GNU toolchain (MinGW) to match our Go/FFI build target.
  test-proc-ports:
    name: Test sysprims-proc port bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # pin:runner=linux-x64
            target: x86_64-unknown-linux-gnu
          - os: windows-2025  # pin:runner=windows-x64
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.1  # pin:rust=stable
          targets: ${{ matrix.target }}
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Run sysprims-proc tests (Linux)
        if: runner.os != 'Windows'
        run: cargo test -p sysprims-proc
      - name: Run sysprims-proc tests (Windows GNU)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cargo test -p sysprims-proc --target x86_64-pc-windows-gnu
  # Musl build test (Linux only)
  test-musl:
    name: Test (Linux musl)
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust and musl target
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.1  # pin:rust=stable
          targets: x86_64-unknown-linux-musl
      - name: Build with musl
        run: cargo build --workspace --exclude sysprims-ts-napi --target x86_64-unknown-linux-musl
      - name: Test with musl
        run: cargo test --workspace --exclude sysprims-ts-napi --target x86_64-unknown-linux-musl
  # Go bindings tests
  # Windows cgo requires a GNU-ABI C toolchain:
  # - windows-amd64 uses msys2/MinGW-w64 (x86_64-pc-windows-gnu)
  # - windows-arm64 uses llvm-mingw (aarch64-pc-windows-gnullvm), since v0.1.16
  # See docs/standards/platform-support.md and ADR-0012 for details.
  test-go:
    name: Test Go Bindings (${{ matrix.lib_dir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # pin:runner=linux-x64
            lib_dir: linux-amd64
            lib_name: libsysprims_ffi.a
          - os: macos-15  # pin:runner=macos-arm64
            lib_dir: darwin-arm64
            lib_name: libsysprims_ffi.a
          - os: windows-2025  # pin:runner=windows-x64
            lib_dir: windows-amd64
            lib_name: libsysprims_ffi.a
            rust_target: x86_64-pc-windows-gnu
            win_toolchain: msys2
          - os: windows-latest-arm64-s
            lib_dir: windows-arm64
            lib_name: libsysprims_ffi.a
            rust_target: aarch64-pc-windows-gnullvm
            win_toolchain: llvm-mingw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: '1.26.10'
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.1  # pin:rust=stable
          targets: ${{ matrix.rust_target }}
      - name: Install MinGW (Windows x64, msys2)
        if: matrix.win_toolchain == 'msys2'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Install llvm-mingw (Windows arm64, pinned)
        if: matrix.win_toolchain == 'llvm-mingw'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ env.LLVM_MINGW_VERSION }}'
          $zipName = "llvm-mingw-$tag-ucrt-aarch64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/$zipName"
          Write-Host "Downloading pinned llvm-mingw $tag from: $url"
          $zipPath = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          $extractRoot = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force
          $topDir = Get-ChildItem -Path $extractRoot -Directory | Select-Object -First 1
          $binDir = Join-Path $topDir.FullName 'bin'
          if (-not (Test-Path $binDir)) { throw "llvm-mingw bin directory not found at $binDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
      - name: Install cbindgen
        run: cargo install cbindgen --version ${{ env.CBINDGEN_VERSION }} --locked
      - name: Build FFI library (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release -p sysprims-ffi
      - name: Regenerate Go header (Unix)
        if: runner.os != 'Windows'
        run: make header-go
      - name: Build FFI library (Windows x64, msys2)
        if: matrix.win_toolchain == 'msys2'
        shell: msys2 {0}
        run: cargo build --release --target ${{ matrix.rust_target }} -p sysprims-ffi
      - name: Build FFI library (Windows arm64, llvm-mingw)
        if: matrix.win_toolchain == 'llvm-mingw'
        shell: pwsh
        run: cargo build --release --target ${{ matrix.rust_target }} -p sysprims-ffi
      - name: Regenerate Go header (Windows)
        if: runner.os == 'Windows'
        run: make header-go
      - name: Copy FFI to local lib (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bindings/go/sysprims/lib/local/${{ matrix.lib_dir }}
          cp target/release/${{ matrix.lib_name }} bindings/go/sysprims/lib/local/${{ matrix.lib_dir }}/
      - name: Copy FFI to local lib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bindings/go/sysprims/lib/local/${{ matrix.lib_dir }}
          cp target/${{ matrix.rust_target }}/release/${{ matrix.lib_name }} \
            bindings/go/sysprims/lib/local/${{ matrix.lib_dir }}/
      - name: Run Go tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cd bindings/go/sysprims
          go test -v ./...
      - name: govulncheck (Go bindings)
        if: matrix.lib_dir == 'linux-amd64'
        working-directory: bindings/go/sysprims
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Run Go tests (Windows x64, msys2)
        if: matrix.win_toolchain == 'msys2'
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: |
          cd bindings/go/sysprims
          go test -v ./...
      - name: Run Go tests (Windows arm64, llvm-mingw)
        if: matrix.win_toolchain == 'llvm-mingw'
        shell: pwsh
        working-directory: bindings/go/sysprims
        env:
          CGO_ENABLED: "1"
          CC: aarch64-w64-mingw32-gcc
          CXX: aarch64-w64-mingw32-g++
          AR: llvm-ar
        run: go test -v ./...
  recurrence:
    # Rust crate and pure-Go module for contract recurrence/v0: each passes the
    # pinned corpus, and their outputs agree byte for byte (corpus NDJSON and
    # generated rules) on every OS cell.
    name: Recurrence Rust/Go agreement (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04  # pin:runner=linux-x64
          - macos-15  # pin:runner=macos-arm64
          - windows-2025  # pin:runner=windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88.0  # pin:rust=msrv
      - name: Rust crate
        run: cargo test -p sysprims-recurrence
      - name: Go module (standalone, pure Go)
        working-directory: go/recurrence
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          test -z "$(gofmt -l .)"
          if grep -Eq '^[[:space:]]*replace([[:space:]]|\()' go.mod; then
            echo "go/recurrence/go.mod must not contain replace directives" >&2
            exit 1
          fi
          go vet ./...
          go test -count=1 ./...
      # Run gosec and govulncheck directly against go/recurrence with GOWORK=off.
      - name: Go module security (gosec, govulncheck)
        if: runner.os == 'Linux'
        working-directory: go/recurrence
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          "$(go env GOPATH)/bin/gosec" ./...
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Go module alone (outside the repository, no SKIP allowed)
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          corpus="$PWD/crates/sysprims-recurrence/tests/recurrence-v0"
          standalone="$(mktemp -d)/recurrence"
          cp -R go/recurrence "$standalone"
          cd "$standalone"
          RECURRENCE_CORPUS_DIR="$corpus" go test -count=1 -v ./... | tee "$RUNNER_TEMP/go-standalone.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/go-standalone.log"; then
            echo "standalone go/recurrence tests must not skip" >&2
            exit 1
          fi
      - name: Rust/Go agreement
        run: scripts/recurrence-crosscheck.sh
  evidence:
    # Rust crate and pure-Go root module for identity-evidence/v0 and
    # native-process-observation:v0: each passes the pinned corpus and their
    # NDJSON outputs agree byte for byte on every OS cell.
    name: Evidence Rust/Go agreement (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04  # pin:runner=linux-x64
          - macos-15  # pin:runner=macos-arm64
          - windows-2025  # pin:runner=windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88.0  # pin:rust=msrv
      - name: Rust crate
        run: |
          cargo test -p sysprims-evidence
          cargo test -p sysprims-proc --test observation
      - name: Go module (standalone, pure Go)
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          test -z "$(gofmt -l ./evidence ./procobserve)"
          if grep -Eq '^[[:space:]]*replace([[:space:]]|\()' go.mod; then
            echo "go.mod must not contain replace directives" >&2
            exit 1
          fi
          go vet ./evidence/... ./procobserve/...
          go test -count=1 ./evidence/... ./procobserve/...
      - name: Go module security (gosec, govulncheck)
        if: runner.os == 'Linux'
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          "$(go env GOPATH)/bin/gosec" ./evidence/... ./procobserve/...
          "$(go env GOPATH)/bin/govulncheck" ./evidence/... ./procobserve/...
      - name: Go module alone (outside the repository, no SKIP allowed)
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          corpus="$PWD/crates/sysprims-evidence/tests/identity-evidence-v0"
          parity="$PWD/crates/sysprims-evidence/tests/parity-cases.json"
          standalone="$(mktemp -d)/sysprims-evidence-go"
          mkdir -p "$standalone"
          cp go.mod go.sum LICENSE-MIT LICENSE-APACHE NOTICE "$standalone/"
          cp -R evidence "$standalone/evidence"
          cp -R procobserve "$standalone/procobserve"
          cd "$standalone"
          EVIDENCE_CORPUS_DIR="$corpus" EVIDENCE_PARITY_CASES="$parity" \
            go test -count=1 -v ./evidence/... ./procobserve/... | tee "$RUNNER_TEMP/go-evidence-standalone.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/go-evidence-standalone.log"; then
            echo "standalone evidence Go tests must not skip" >&2
            exit 1
          fi
      - name: Rust/Go agreement
        run: bash scripts/evidence-crosscheck.sh
  license-check:
    name: License & Dependency Check
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc@sha256:616a4b5361d2cf7d32ac32496d58e9c288660d5606f0a27efdbf56e3a462ab2d
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Report Goneat version
        run: goneat version
      - name: License check
        run: |
          cargo deny check licenses
          cargo deny --manifest-path bindings/python/Cargo.toml check licenses
      - name: Advisory check
        run: |
          cargo deny check advisories
          cargo deny --manifest-path bindings/python/Cargo.toml check advisories
      - name: Dependency assessment
        run: goneat assess --categories dependencies --check --fail-on high
  security-audit:
    name: Security Audit
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.1  # pin:rust=stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Security audit
        run: |
          cargo audit
          cargo audit --file bindings/python/Cargo.lock
  python-bindings:
    name: Test Python Bindings (${{ matrix.target }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # pin:runner=linux-x64
            target: x86_64-unknown-linux-gnu
            python: '3.10'
          - os: ubuntu-24.04  # pin:runner=linux-x64
            target: x86_64-unknown-linux-gnu
            python: '3.14'
          - os: macos-15  # pin:runner=macos-arm64
            target: aarch64-apple-darwin
            python: '3.14'
          - os: windows-2025  # pin:runner=windows-x64
            target: x86_64-pc-windows-msvc
            python: '3.14'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88.0  # pin:rust=msrv
          targets: ${{ matrix.target }}
      - name: Build and verify Python wheel and sdist
        run: make python-check PYTHON=python
  python-bindings-arm64:
    name: Test Python Bindings (aarch64-unknown-linux-gnu, 3.14)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest-arm64-s
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.14'
      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88.0  # pin:rust=msrv
          targets: aarch64-unknown-linux-gnu
      - name: Build and verify Python wheel and sdist
        run: make python-check PYTHON=python
  # Container-based privileged tests
  # These tests require isolation because they verify dangerous signal behaviors
  # See: ADR-0011
  container-tests:
    name: Container Tests (Privileged)
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    needs: [format, lint, test]  # Only run after basic checks pass
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Build test container
        run: |
          docker build -t sysprims-test-fixture -f Dockerfile.container .
      - name: Run container tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace:ro \
            -v ${{ github.workspace }}/target:/workspace/target \
            sysprims-test-fixture

