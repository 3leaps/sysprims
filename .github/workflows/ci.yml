name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # Pinned llvm-mingw release tag for Windows arm64 GNU toolchain. Bump here
  # and in go-bindings.yml / release.yml together when advancing. See
  # docs/standards/platform-support.md for toolchain policy.
  LLVM_MINGW_VERSION: '20260407'
jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all -- --check
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  planning-hygiene:
    name: Planning Reference Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No private planning-plane references in tracked files
        run: bash scripts/check-planning-hygiene.sh
  windows-cross-check:
    name: Windows Cross-Target Check (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,x86_64-pc-windows-gnu,aarch64-pc-windows-msvc
      # cargo check does type checking only (no linking), so this works without the Windows SDK.
      # This is a fast guardrail for Windows-only compile errors.
      - name: cargo check (windows msvc x64)
        run: cargo check --workspace --exclude sysprims-ts-napi --target x86_64-pc-windows-msvc
      - name: cargo check (windows gnu x64)
        run: cargo check --workspace --exclude sysprims-ts-napi --target x86_64-pc-windows-gnu
      - name: cargo check (windows msvc arm64)
        run: cargo check --workspace --exclude sysprims-ts-napi --target aarch64-pc-windows-msvc
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest-arm64-s
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Run FFI smoke tests
        run: cargo test -p sysprims-ffi
  # Port bindings invariant tests (self-listener discoverable)
  # Windows runs GNU toolchain (MinGW) to match our Go/FFI build target.
  test-proc-ports:
    name: Test sysprims-proc port bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Run sysprims-proc tests (Linux)
        if: runner.os != 'Windows'
        run: cargo test -p sysprims-proc
      - name: Run sysprims-proc tests (Windows GNU)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cargo test -p sysprims-proc --target x86_64-pc-windows-gnu
  # Musl build test (Linux only)
  test-musl:
    name: Test (Linux musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build with musl
        run: cargo build --workspace --exclude sysprims-ts-napi --target x86_64-unknown-linux-musl
      - name: Test with musl
        run: cargo test --workspace --exclude sysprims-ts-napi --target x86_64-unknown-linux-musl
  # Go bindings tests
  # Windows cgo requires a GNU-ABI C toolchain:
  # - windows-amd64 uses msys2/MinGW-w64 (x86_64-pc-windows-gnu)
  # - windows-arm64 uses llvm-mingw (aarch64-pc-windows-gnullvm), since v0.1.16
  # See docs/standards/platform-support.md and ADR-0012 for details.
  test-go:
    name: Test Go Bindings (${{ matrix.lib_dir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib_dir: linux-amd64
            lib_name: libsysprims_ffi.a
          - os: macos-latest
            lib_dir: darwin-arm64
            lib_name: libsysprims_ffi.a
          - os: windows-latest
            lib_dir: windows-amd64
            lib_name: libsysprims_ffi.a
            rust_target: x86_64-pc-windows-gnu
            win_toolchain: msys2
          - os: windows-latest-arm64-s
            lib_dir: windows-arm64
            lib_name: libsysprims_ffi.a
            rust_target: aarch64-pc-windows-gnullvm
            win_toolchain: llvm-mingw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install MinGW (Windows x64, msys2)
        if: matrix.win_toolchain == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Install llvm-mingw (Windows arm64, pinned)
        if: matrix.win_toolchain == 'llvm-mingw'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ env.LLVM_MINGW_VERSION }}'
          $zipName = "llvm-mingw-$tag-ucrt-aarch64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/$zipName"
          Write-Host "Downloading pinned llvm-mingw $tag from: $url"
          $zipPath = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          $extractRoot = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force
          $topDir = Get-ChildItem -Path $extractRoot -Directory | Select-Object -First 1
          $binDir = Join-Path $topDir.FullName 'bin'
          if (-not (Test-Path $binDir)) { throw "llvm-mingw bin directory not found at $binDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      - name: Build FFI library (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release -p sysprims-ffi
      - name: Regenerate Go header (Unix)
        if: runner.os != 'Windows'
        run: make header-go
      - name: Build FFI library (Windows x64, msys2)
        if: matrix.win_toolchain == 'msys2'
        shell: msys2 {0}
        run: cargo build --release --target ${{ matrix.rust_target }} -p sysprims-ffi
      - name: Build FFI library (Windows arm64, llvm-mingw)
        if: matrix.win_toolchain == 'llvm-mingw'
        shell: pwsh
        run: cargo build --release --target ${{ matrix.rust_target }} -p sysprims-ffi
      - name: Regenerate Go header (Windows)
        if: runner.os == 'Windows'
        run: make header-go
      - name: Copy FFI to local lib (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bindings/go/sysprims/lib/local/${{ matrix.lib_dir }}
          cp target/release/${{ matrix.lib_name }} bindings/go/sysprims/lib/local/${{ matrix.lib_dir }}/
      - name: Copy FFI to local lib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bindings/go/sysprims/lib/local/${{ matrix.lib_dir }}
          cp target/${{ matrix.rust_target }}/release/${{ matrix.lib_name }} \
            bindings/go/sysprims/lib/local/${{ matrix.lib_dir }}/
      - name: Run Go tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cd bindings/go/sysprims
          go test -v ./...
      - name: Run Go tests (Windows x64, msys2)
        if: matrix.win_toolchain == 'msys2'
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: |
          cd bindings/go/sysprims
          go test -v ./...
      - name: Run Go tests (Windows arm64, llvm-mingw)
        if: matrix.win_toolchain == 'llvm-mingw'
        shell: pwsh
        working-directory: bindings/go/sysprims
        env:
          CGO_ENABLED: "1"
          CC: aarch64-w64-mingw32-gcc
          CXX: aarch64-w64-mingw32-g++
          AR: llvm-ar
        run: go test -v ./...
  license-check:
    name: License & Dependency Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.3.4
      options: --user root
    steps:
      - uses: actions/checkout@v7
      - name: License check
        run: cargo deny check licenses
      - name: Advisory check
        run: cargo deny check advisories
      - name: Dependency assessment
        run: goneat assess --categories dependencies --fail-on high
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Security audit
        run: cargo audit
  # Container-based privileged tests
  # These tests require isolation because they verify dangerous signal behaviors
  # See: ADR-0011
  container-tests:
    name: Container Tests (Privileged)
    runs-on: ubuntu-latest
    needs: [format, lint, test]  # Only run after basic checks pass
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test container
        run: |
          docker build -t sysprims-test-fixture -f Dockerfile.container .
      - name: Run container tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace:ro \
            -v ${{ github.workspace }}/target:/workspace/target \
            sysprims-test-fixture

# NOTE: MSRV and Miri checks available locally via `make msrv` and `make miri`
# Add to CI after runner image supports these toolchains
