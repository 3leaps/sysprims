name: TypeScript Bindings
# Runs on every pull request so that "TypeScript gate" can be a required
# check. The changes job decides whether the native matrix needs to run.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
jobs:
  changes:
    name: Detect TypeScript-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # NUL-delimited raw paths (no quoting) with renames split into a
          # deletion and an addition, matched in-process (no pipe, so no
          # SIGPIPE under pipefail on large diffs).
          patterns=(
            '^bindings/typescript/sysprims/'
            '^crates/sysprims-(core|proc|session|signal|timeout)/'
            '^Cargo\.(lock|toml)$'
            '^\.github/workflows/typescript-bindings\.yml$'
          )
          # A failed diff must fail the job, never read as "nothing changed".
          paths_file="$RUNNER_TEMP/changed-paths"
          git diff --name-only --no-renames -z "$BASE_SHA"...HEAD >"$paths_file"
          relevant=false
          while IFS= read -r -d '' path; do
            printf '%s\n' "$path"
            for pattern in "${patterns[@]}"; do
              if [[ "$path" =~ $pattern ]]; then relevant=true; fi
            done
          done <"$paths_file"
          if [ "$relevant" = true ]; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
          else
            echo "relevant=false" >>"$GITHUB_OUTPUT"
          fi
  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Native behavior (${{ matrix.platform }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            runtime: node-18
            node-version: '18'
          - os: ubuntu-latest
            platform: linux-x64
            runtime: node-22
            node-version: '22'
          - os: ubuntu-latest
            platform: linux-x64
            runtime: bun-1.3.3
            node-version: '22'
          - os: macos-14
            platform: macos-arm64
            runtime: node-18
            node-version: '18'
          - os: macos-14
            platform: macos-arm64
            runtime: node-22
            node-version: '22'
          - os: macos-14
            platform: macos-arm64
            runtime: bun-1.3.3
            node-version: '22'
          - os: windows-latest
            platform: windows-x64
            runtime: node-18
            node-version: '18'
          - os: windows-latest
            platform: windows-x64
            runtime: node-22
            node-version: '22'
          - os: windows-latest
            platform: windows-x64
            runtime: bun-1.3.3
            node-version: '22'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
      # Build with Node 22 (@napi-rs/cli 3 needs Node >=20.17); the behavior
      # tests below run on the matrix runtime.
      - name: Setup Node (build)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: bindings/typescript/sysprims/package-lock.json
      - name: Setup Bun 1.3.3
        if: startsWith(matrix.runtime, 'bun-')
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.3
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        # package.json lists no platform packages (they are injected at
        # publish time), so the lock file installs as-is.
        run: npm ci --ignore-scripts
      - name: Build package, native addon, and behavior tests
        working-directory: bindings/typescript/sysprims
        run: npm run clean && npm run build && npm run build:native && npm run build:test
      - name: Setup Node (runtime under test)
        if: startsWith(matrix.runtime, 'node-')
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check runtime N-API inventory (Node)
        if: startsWith(matrix.runtime, 'node-')
        working-directory: bindings/typescript/sysprims
        run: npm run api:check:native
      - name: Check runtime N-API inventory (Bun)
        if: startsWith(matrix.runtime, 'bun-')
        working-directory: bindings/typescript/sysprims
        run: bun scripts/public-api.js check --require-native
      - name: Run behavior tests (Node)
        if: startsWith(matrix.runtime, 'node-')
        working-directory: bindings/typescript/sysprims
        run: node scripts/run-tests.js
      - name: Run behavior tests (Bun)
        if: startsWith(matrix.runtime, 'bun-')
        working-directory: bindings/typescript/sysprims
        run: bun scripts/run-tests.js
  package-only:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Build/package only (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest-arm64-s
            platform: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            expected-file: sysprims.linux-arm64-gnu.node
            package-dir: linux-arm64-gnu
          - os: ubuntu-latest-arm64-s
            platform: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            expected-file: sysprims.linux-arm64-musl.node
            package-dir: linux-arm64-musl
          - os: windows-latest-arm64-s
            platform: windows-arm64-msvc
            target: aarch64-pc-windows-msvc
            expected-file: sysprims.win32-arm64-msvc.node
            package-dir: win32-arm64-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884  # 1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: bindings/typescript/sysprims/package-lock.json
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        # package.json lists no platform packages (they are injected at
        # publish time), so the lock file installs as-is.
        run: npm ci --ignore-scripts
      # musl builds use the same zig cross-compile path as the release
      # prebuilds (typescript-napi-prebuilds.yml), with the same pins.
      - name: Install Zig
        if: endsWith(matrix.target, '-musl')
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2
        with:
          version: 0.12.0
      - name: Install cargo-zigbuild
        if: endsWith(matrix.target, '-musl')
        run: cargo install cargo-zigbuild --locked --version 0.23.4
      - name: Check native target
        run: cargo check -p sysprims-ts-napi --target ${{ matrix.target }}
      - name: Build target native addon
        working-directory: bindings/typescript/sysprims
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          extra=()
          if [[ "$TARGET" == *-musl ]]; then extra=(--cross-compile); fi
          npx napi build --manifest-path native/Cargo.toml --release --platform \
            --no-js --strip --output-dir . --target "$TARGET" "${extra[@]}"
      - name: Create target package
        working-directory: bindings/typescript/sysprims
        env:
          EXPECTED_FILE: ${{ matrix.expected-file }}
          PACKAGE_DIR: ${{ matrix.package-dir }}
        run: |
          npx napi create-npm-dirs
          node scripts/stage-platform-package.js
      - name: Inspect target package
        working-directory: bindings/typescript/sysprims
        run: node scripts/verify-platform-packages.js "${{ matrix.package-dir }}"
  test-musl:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Test (linux-musl, alpine)
    runs-on: ubuntu-latest
    container:
      image: node:22.23.4-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install build dependencies
        shell: sh
        run: |
          set -eu
          apk add --no-cache bash curl build-base python3 git
      - name: Install Rust (rustup)
        shell: bash
        run: |
          set -euo pipefail
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain 1.88.0
          . "$HOME/.cargo/env"
          rustc -V
          cargo -V
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          npm ci --ignore-scripts
      - name: Test
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          npm run test:ci
  # Required status check. Passes when nothing TypeScript-relevant changed;
  # otherwise every native job must have succeeded.
  gate:
    name: TypeScript gate
    if: always()
    needs: [changes, test, package-only, test-musl]
    runs-on: ubuntu-latest
    steps:
      - env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          PACKAGE_ONLY: ${{ needs.package-only.result }}
          TEST_MUSL: ${{ needs.test-musl.result }}
        run: |
          set -euo pipefail
          [ "$CHANGES" = success ] || { echo "change detection: $CHANGES" >&2; exit 1; }
          if [ "$RELEVANT" != true ]; then
            echo "no TypeScript-relevant changes"
            exit 0
          fi
          for result in "$TEST" "$PACKAGE_ONLY" "$TEST_MUSL"; do
            [ "$result" = success ] || { echo "native job result: $result" >&2; exit 1; }
          done
