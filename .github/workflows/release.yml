  package-npm-tarballs:
    name: Package npm Tarballs
    if: needs.validate-version.outputs.typescript_disposition == 'publish'
    needs:
      - validate-version
      - build-ts-linux
      - build-ts-linux-arm64
      - build-ts-macos-arm64
      - build-ts-windows
      - build-ts-windows-arm64
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.ref }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24.22.1'
      - name: Install Node dependencies and build JS dist
        working-directory: bindings/typescript/sysprims
        run: |
          npm ci --ignore-scripts
          npm run clean
          npm run build
      - name: Download N-API prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: ts-prebuilds-*
          path: downloaded-prebuilds
      - name: Assemble platform packages and verify metadata
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          rm -rf npm
          npx napi create-npm-dirs
          rm -rf npm/darwin-x64
          shopt -s nullglob globstar
          for f in ../../../downloaded-prebuilds/**/*.node; do
            base="$(basename "$f")"
            plat="${base#sysprims.}"
            plat="${plat%.node}"
            dest="npm/${plat}/${base}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
          npm run platform-packages:check
          node scripts/set-platform-packages.js npm
      - name: Stage and compare all 8 npm tarballs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/npm-release.mjs stage \
            --stage dist/npm-stage \
            --native-dir bindings/typescript/sysprims/npm \
            --root-package bindings/typescript/sysprims \
            --tag "${{ github.ref_name }}" \
            --commit "${{ needs.validate-version.outputs.commit }}"
          node scripts/npm-release.mjs compare \
            --stage dist/npm-stage \
            --tag "${{ github.ref_name }}" \
            --commit "${{ needs.validate-version.outputs.commit }}"
      - name: Upload npm tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: npm-tarballs
          path: dist/npm-stage/packages/*.tgz
          if-no-files-found: error
  # Assemble the unsigned release payload as one workflow artifact. This workflow
  # holds read-only permissions and never creates or edits a release: the
  # maintainer downloads this artifact, signs locally, creates the draft and
  # publishes after verification.
  release-packages:
    name: Release Packages
    if: |
      always() &&
      needs.validate-version.result == 'success' &&
      needs.verify-go-bindings-assets.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-windows-arm64.result == 'success' &&
      needs.cbindgen.result == 'success' &&
      needs.sbom.result == 'success' &&
      needs.package-ffi-bundle.result == 'success' &&
      needs.build-windows-msvc.result == 'success' &&
      needs.verify-ffi-shared-assets.result == 'success' &&
      (needs.validate-version.outputs.python_disposition != 'publish' || (
        needs.build-wheels.result == 'success' &&
        needs.build-wheel-linux-amd64.result == 'success' &&
        needs.build-wheel-linux-arm64.result == 'success' &&
        needs.build-python-sdist.result == 'success'
      )) &&
      (
        needs.validate-version.outputs.typescript_disposition != 'publish' ||
        needs.package-npm-tarballs.result == 'success'
      )
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    needs:
      - validate-version
      - verify-go-bindings-assets
      - build-linux
      - build-macos
      - build-windows
      - build-windows-arm64
      - cbindgen
      - sbom
      - package-ffi-bundle
      - build-windows-msvc
      - verify-ffi-shared-assets
      - build-wheels
      - build-wheel-linux-amd64
      - build-wheel-linux-arm64
      - build-python-sdist
      - package-npm-tarballs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.ref }}
      - name: Download all CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: cli-*
          path: release-cli
      - name: Download FFI bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ffi-bundle
          path: release-ffi
      - name: Download C header
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: c-header
          path: release-header
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sbom
          path: release-sbom
      - name: Download Python wheels
        if: needs.validate-version.outputs.python_disposition == 'publish'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: wheel-*
          path: release-wheels
      - name: Download Python sdist
        if: needs.validate-version.outputs.python_disposition == 'publish'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: python-sdist
          path: release-sdist
      - name: Download npm tarballs
        if: needs.validate-version.outputs.typescript_disposition == 'publish'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: npm-tarballs
          path: release-npm
      - name: Organize release files
        run: |
          mkdir -p release

          # CLI archives
          find release-cli -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/ \;

          # FFI bundle
          mv release-ffi/*.tar.gz release/

          # Header
          mv release-header/sysprims.h release/

          # SBOM
          mv release-sbom/*.json release/

          # Python wheels and sdist
          if [ -d release-wheels ]; then
            find release-wheels -type f -name '*.whl' -exec mv {} release/ \;
          fi
          if [ -d release-sdist ]; then
            mv release-sdist/*.tar.gz release/
          fi

          # npm tarballs
          if [ -d release-npm ]; then
            mv release-npm/*.tgz release/
          fi

          # Licenses
          cp LICENSE-MIT LICENSE-APACHE release/

          ls -la release/
      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-packages-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

# NOTE: Go bindings require committed prebuilt libs under
# bindings/go/sysprims/lib/<platform>/libsysprims_ffi.a so `go get` works.
# We prepare those libs via a separate workflow (`go-bindings.yml`) BEFORE tagging.
#
# The `verify-go-bindings-assets` job gates this release so we never publish
# a version where Go can fetch the module but cannot link.
# (intentionally no job here)
