        with:
          ref: ${{ github.ref }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22.23.4'
      - name: Install Rust MSRV toolchain
        uses: ./.github/actions/setup-rust
