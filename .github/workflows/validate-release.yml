name: Validate Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate (e.g. v0.1.4)"
        required: true
        type: string
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  validate-go:
    name: Validate Go Bindings
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22.23.4'
      - name: Verify and materialize tag messages
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          MESSAGE_DIR="$RUNNER_TEMP/sysprims-tag-messages"
          export MESSAGE_DIR RELEASE_TAG
          mkdir -p "$MESSAGE_DIR"
          node scripts/release-materialize-tag-messages.mjs
          echo "SYSPRIMS_TAG_MESSAGE_DIR=$MESSAGE_DIR" >> "$GITHUB_ENV"
      - name: Guard exact canonical and Go tags
        env:
          SYSPRIMS_RELEASE_TAG: ${{ inputs.tag }}
          SYSPRIMS_TAG_GUARD_MODE: post-tag
        run: bash scripts/release-guard-tag-version.sh
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: '1.26.10'
      - name: Test Go modules are fetchable
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          GO_VERSION="v${VERSION}"

          for GO_MODULE in \
            "github.com/3leaps/sysprims/go/recurrence" \
            "github.com/3leaps/sysprims"
          do
            echo "Testing: go get ${GO_MODULE}@${GO_VERSION}"
            WORKDIR="$(mktemp -d)"
            (
              cd "${WORKDIR}"
              go mod init test-sysprims
              go get "${GO_MODULE}@${GO_VERSION}"
            )
          done

          echo "Go module fetch: OK"
  validate-typescript:
    name: Validate TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # pin:runner=linux-x64
          - os: ubuntu-latest-arm64-s
          - os: macos-15  # pin:runner=macos-arm64
          - os: windows-2025  # pin:runner=windows-x64
          - os: windows-latest-arm64-s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.1  # pin:rust=stable
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22.23.4'
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        run: npm ci --ignore-scripts
      - name: Test
        working-directory: bindings/typescript/sysprims
        run: npm run test:ci
  validate-typescript-musl:
    name: Validate TypeScript (linux-musl, alpine)
    runs-on: ubuntu-24.04  # pin:runner=linux-x64
    container:
      image: node:22.23.4-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Install build dependencies
        shell: sh
        run: |
          set -eu
          apk add --no-cache bash curl build-base python3 git
      - name: Install Rust (rustup)
        shell: bash
        env:
          RUST_TOOLCHAIN: 1.88.0  # pin:rust=msrv
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          . "$HOME/.cargo/env"
          rustc -V
          cargo -V
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          npm ci --ignore-scripts
      - name: Test
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          npm run test:ci
