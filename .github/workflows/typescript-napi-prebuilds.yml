name: TypeScript N-API Prebuilds
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build"
        required: true
        default: "v0.2.4"
        type: string
env:
  CARGO_TERM_COLOR: always
jobs:
  validate:
    name: Validate release tag and versions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify and materialize tag messages
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          MESSAGE_DIR="$RUNNER_TEMP/sysprims-tag-messages"
          export MESSAGE_DIR RELEASE_TAG
          mkdir -p "$MESSAGE_DIR"

          git fetch --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "refs/tags/bindings/go/sysprims/${RELEASE_TAG}:refs/tags/bindings/go/sysprims/${RELEASE_TAG}"

          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { readFileSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");

          const version = readFileSync("VERSION", "utf8").trim();
          const releaseTag = process.env.RELEASE_TAG;
          if (releaseTag !== `v${version}`) {
            throw new Error(`release tag ${releaseTag} does not match VERSION ${version}`);
          }

          const tags = [releaseTag, `bindings/go/sysprims/${releaseTag}`];
          const expectedSubjects = new Map([
            [releaseTag, `Release ${version}`],
            [`bindings/go/sysprims/${releaseTag}`, `bindings/go/sysprims/${releaseTag}`],
          ]);
          const footer = new RegExp(
            "(?:^|\\n)Generated by .+ via .+ under supervision of @3leapsdave\\n\\n" +
              "Co-Authored-By: .+ <noreply@3leaps\\.net>\\n" +
              "Role: [a-z][a-z0-9-]*\\n" +
              "Committer-of-Record: @3leapsdave\\s*$",
          );

          for (const tag of tags) {
            const object = execFileSync("git", ["cat-file", "tag", `refs/tags/${tag}`]);
            const separator = object.indexOf(Buffer.from("\n\n"));
            if (separator === -1) throw new Error(`annotated tag object is malformed for ${tag}`);
            const message = object.subarray(separator + 2);
            const text = message.toString("utf8");
            if (text.split("\n", 1)[0] !== expectedSubjects.get(tag)) {
              throw new Error(`unexpected annotation subject for ${tag}`);
            }
            if (!footer.test(text)) {
              throw new Error(`tag ${tag} does not contain the complete attribution footer`);
            }
            writeFileSync(join(process.env.MESSAGE_DIR, `${tag.replaceAll("/", "__")}.txt`), message);
          }
          NODE

          echo "SYSPRIMS_TAG_MESSAGE_DIR=$MESSAGE_DIR" >> "$GITHUB_ENV"
      - name: Guard exact tags and complete version pack
        id: identity
        shell: bash
        env:
          SYSPRIMS_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$SYSPRIMS_RELEASE_TAG" != v* ]]; then
            echo "ERROR: Input tag must be a canonical vX.Y.Z tag" >&2
            exit 1
          fi
          SYSPRIMS_TAG_GUARD_MODE=post-tag \
            bash scripts/release-guard-tag-version.sh
          echo "tag=$SYSPRIMS_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
  build-linux:
    name: Build Linux prebuilds
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884  # 1.88.0
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2
        with:
          version: 0.12.0
      - name: Install Rust targets
        shell: bash
        run: |
          set -euo pipefail
          # arm64-gnu built natively on ubuntu-latest-arm64-s (build-linux-arm64 job)
          rustup target add \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        run: npm install
      - name: Build .node files (zig)
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          rm -f sysprims.*.node
          mkdir -p prebuilds

          # glibc baseline (2.17) for broad compatibility
          npx napi build --cargo-cwd native --release --platform --js false --strip \
            --target x86_64-unknown-linux-gnu --zig --zig-abi-suffix 2.17
          mv sysprims.linux-x64-gnu.node prebuilds/

          npx napi build --cargo-cwd native --release --platform --js false --strip \
            --target x86_64-unknown-linux-musl --zig
          mv sysprims.linux-x64-musl.node prebuilds/

          # arm64-gnu built natively on ubuntu-latest-arm64-s (build-linux-arm64 job)

          npx napi build --cargo-cwd native --release --platform --js false --strip \
            --target aarch64-unknown-linux-musl --zig
          mv sysprims.linux-arm64-musl.node prebuilds/
      - name: Upload prebuilds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ts-prebuilds-linux
          path: bindings/typescript/sysprims/prebuilds/*.node
  build-linux-arm64:
    name: Build Linux arm64 prebuild (native)
    runs-on: ubuntu-latest-arm64-s
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884  # 1.88.0
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        run: npm install
      - name: Build .node file
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          rm -f sysprims.*.node
          mkdir -p prebuilds
          npx napi build --cargo-cwd native --release --platform --js false --strip
          mv sysprims.linux-arm64-gnu.node prebuilds/
      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ts-prebuilds-linux-arm64-gnu-native
          path: bindings/typescript/sysprims/prebuilds/*.node
  build-macos-arm64:
    name: Build macOS arm64 prebuild
    runs-on: macos-14
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884  # 1.88.0
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        run: npm install
      - name: Build .node file
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          rm -f sysprims.*.node
          mkdir -p prebuilds
          npx napi build --cargo-cwd native --release --platform --js false --strip
          mv sysprims.darwin-arm64.node prebuilds/
      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ts-prebuilds-darwin-arm64
          path: bindings/typescript/sysprims/prebuilds/*.node
  build-windows:
    name: Build Windows x64 prebuild
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884  # 1.88.0
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        run: npm install
      - name: Build .node file
        working-directory: bindings/typescript/sysprims
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Force sysprims.*.node -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path prebuilds | Out-Null
          npx napi build --cargo-cwd native --release --platform --js false --strip
          Move-Item sysprims.win32-x64-msvc.node prebuilds/
      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ts-prebuilds-win32-x64-msvc
          path: bindings/typescript/sysprims/prebuilds/*.node
  build-windows-arm64:
    name: Build Windows arm64 prebuild
    runs-on: windows-latest-arm64-s
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884  # 1.88.0
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        run: npm install
      - name: Build .node file
        working-directory: bindings/typescript/sysprims
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Force sysprims.*.node -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path prebuilds | Out-Null
          npx napi build --cargo-cwd native --release --platform --js false --strip
          Move-Item sysprims.win32-arm64-msvc.node prebuilds/
      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ts-prebuilds-win32-arm64-msvc
          path: bindings/typescript/sysprims/prebuilds/*.node
  package:
    name: Package (npm dir)
    runs-on: ubuntu-latest
    needs: [validate, build-linux, build-linux-arm64, build-macos-arm64, build-windows, build-windows-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884  # 1.88.0
      - name: Install Node dependencies
        working-directory: bindings/typescript/sysprims
        run: npm install
      - name: Build JS dist (root package)
        working-directory: bindings/typescript/sysprims
        run: npm run clean && npm run build && npm run build:native
      - name: Remove local .node from root dist
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/native/sysprims.*.node || true
      - name: Download prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: ts-prebuilds-*
          path: downloaded-prebuilds
      - name: Create npm package templates
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          rm -rf npm
          npx napi create-npm-dir -t .
      - name: Remove unsupported platform packages
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          # darwin-x64 (Intel Mac) is not supported as of v0.1.7
          # See docs/standards/platform-support.md
          rm -rf npm/darwin-x64
          echo "Removed unsupported platform: darwin-x64"
      - name: Stage .node files into npm packages
        working-directory: bindings/typescript/sysprims
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          for f in ../../../downloaded-prebuilds/**/*.node; do
            base="$(basename "$f")"
            plat="${base#sysprims.}"
            plat="${plat%.node}"
            dest="npm/${plat}/${base}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
      - name: Verify platform package versions and packed metadata
        working-directory: bindings/typescript/sysprims
        run: npm run platform-packages:check
      - name: Upload npm dir
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ts-npm-dir-${{ needs.validate.outputs.commit }}
          path: bindings/typescript/sysprims/npm
