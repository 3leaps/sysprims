name: TypeScript npm Publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match the selected vX.Y.Z ref)"
        required: false
        type: string
      prebuilds_run_id:
        description: "Prebuild workflow run ID (empty selects the latest successful same-SHA run)"
        required: false
        type: string
      dry_run:
        description: "Stage and compare without entering the protected publish job"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  stage:
    name: Validate and stage npm packages
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
      - name: Guard release plan, exact remote tags, and provenance
        id: identity
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ] || [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Select the canonical vX.Y.Z tag ref"
            exit 1
          fi
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Input tag does not match selected ref"
            exit 1
          fi
          make release-plan-check version-check
          SYSPRIMS_TAG_GUARD_MODE=post-tag \
            SYSPRIMS_RELEASE_TAG="$GITHUB_REF_NAME" \
            bash scripts/release-guard-tag-version.sh
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - name: Locate same-commit prebuild run
        id: prebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.identity.outputs.commit }}"
          run_id="${{ inputs.prebuilds_run_id }}"
          if [ -n "$run_id" ]; then
            actual=$(gh run view "$run_id" --json headSha --jq .headSha)
            if [ "$actual" != "$expected" ]; then
              echo "::error::Prebuild run SHA $actual != $expected"
              exit 1
            fi
          else
            run_id=$(gh run list \
              --workflow=typescript-napi-prebuilds.yml \
              --status=success \
              --limit=50 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$expected\") | .databaseId" \
              | head -n1)
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No successful same-commit prebuild run"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download same-commit native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.prebuild.outputs.run_id }}" \
            --name ts-npm-dir \
            --dir npm-packages
      - name: Build root package
        working-directory: bindings/typescript/sysprims
        run: |
          npm install --omit=optional
          npm run build
      - name: Pack and attest all eight packages
        run: |
          node scripts/npm-release.mjs stage \
            --stage dist/npm-stage \
            --native-dir npm-packages \
            --root-package bindings/typescript/sysprims \
            --tag "${{ steps.identity.outputs.tag }}" \
            --commit "${{ steps.identity.outputs.commit }}"
          node scripts/npm-release.mjs compare \
            --stage dist/npm-stage \
            --tag "${{ steps.identity.outputs.tag }}" \
            --commit "${{ steps.identity.outputs.commit }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: npm-stage-${{ steps.identity.outputs.commit }}
          path: dist/npm-stage
          if-no-files-found: error
  publish:
    name: Publish attested npm packages
    if: ${{ !inputs.dry_run }}
    needs: stage
    runs-on: ubuntu-latest
    environment: publish-npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.stage.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Ensure trusted publishing npm runtime
        env:
          MIN_TRUSTED_PUBLISH_NODE: '22.14.0'
          MIN_TRUSTED_PUBLISH_NPM: '11.5.1'
        run: |
          npm install -g "npm@${MIN_TRUSTED_PUBLISH_NPM}"
          node -e '
            const got = process.versions.node.split(".").map(Number);
            const min = process.env.MIN_TRUSTED_PUBLISH_NODE.split(".").map(Number);
            if (got[0] < min[0] ||
                (got[0] === min[0] && (got[1] < min[1] ||
                (got[1] === min[1] && got[2] < min[2])))) process.exit(1);
          '
          NPM_VERSION="$(npm --version)" node -e '
            const got = process.env.NPM_VERSION.split(".").map(Number);
            const min = process.env.MIN_TRUSTED_PUBLISH_NPM.split(".").map(Number);
            if (got[0] < min[0] ||
                (got[0] === min[0] && (got[1] < min[1] ||
                (got[1] === min[1] && got[2] < min[2])))) process.exit(1);
          '
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: npm-stage-${{ needs.stage.outputs.commit }}
          path: dist/npm-stage
      - name: Verify and resumably publish attested bytes
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-oidc"
          printf '%s\n' \
            'registry=https://registry.npmjs.org/' \
            'always-auth=false' \
            > "$NPM_CONFIG_USERCONFIG"
          node scripts/npm-release.mjs verify \
            --stage dist/npm-stage \
            --tag "${{ needs.stage.outputs.tag }}" \
            --commit "${{ needs.stage.outputs.commit }}"
          node scripts/npm-release.mjs publish \
            --stage dist/npm-stage \
            --tag "${{ needs.stage.outputs.tag }}" \
            --commit "${{ needs.stage.outputs.commit }}"
