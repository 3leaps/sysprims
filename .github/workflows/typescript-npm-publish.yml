name: TypeScript npm Publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        default: "v0.2.4"
        type: string
      prebuilds_run_id:
        description: "Successful TypeScript N-API Prebuilds run ID"
        required: true
        type: string
      dry_run:
        description: "Stage and compare without entering the protected publish job"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  stage:
    name: Validate and stage npm packages
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
      - name: Verify and materialize tag messages
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          MESSAGE_DIR="$RUNNER_TEMP/sysprims-tag-messages"
          export MESSAGE_DIR RELEASE_TAG
          mkdir -p "$MESSAGE_DIR"

          git fetch --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "refs/tags/bindings/go/sysprims/${RELEASE_TAG}:refs/tags/bindings/go/sysprims/${RELEASE_TAG}"

          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { readFileSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");

          const version = readFileSync("VERSION", "utf8").trim();
          const releaseTag = process.env.RELEASE_TAG;
          if (releaseTag !== `v${version}`) {
            throw new Error(`release tag ${releaseTag} does not match VERSION ${version}`);
          }

          const tags = [releaseTag, `bindings/go/sysprims/${releaseTag}`];
          const expectedSubjects = new Map([
            [releaseTag, `Release ${version}`],
            [`bindings/go/sysprims/${releaseTag}`, `bindings/go/sysprims/${releaseTag}`],
          ]);
          const footer = new RegExp(
            "(?:^|\\n)Generated by .+ via .+ under supervision of @3leapsdave\\n\\n" +
              "Co-Authored-By: .+ <noreply@3leaps\\.net>\\n" +
              "Role: [a-z][a-z0-9-]*\\n" +
              "Committer-of-Record: @3leapsdave\\s*$",
          );

          for (const tag of tags) {
            const object = execFileSync("git", ["cat-file", "tag", `refs/tags/${tag}`]);
            const separator = object.indexOf(Buffer.from("\n\n"));
            if (separator === -1) throw new Error(`annotated tag object is malformed for ${tag}`);
            const message = object.subarray(separator + 2);
            const text = message.toString("utf8");
            if (text.split("\n", 1)[0] !== expectedSubjects.get(tag)) {
              throw new Error(`unexpected annotation subject for ${tag}`);
            }
            if (!footer.test(text)) {
              throw new Error(`tag ${tag} does not contain the complete attribution footer`);
            }
            writeFileSync(join(process.env.MESSAGE_DIR, `${tag.replaceAll("/", "__")}.txt`), message);
          }
          NODE

          echo "SYSPRIMS_TAG_MESSAGE_DIR=$MESSAGE_DIR" >> "$GITHUB_ENV"
      - name: Guard release plan, exact remote tags, and provenance
        id: identity
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_TAG" != v* ]]; then
            echo "::error::Input tag must be a canonical vX.Y.Z tag"
            exit 1
          fi
          make release-plan-check version-check
          SYSPRIMS_TAG_GUARD_MODE=post-tag \
            SYSPRIMS_RELEASE_TAG="$INPUT_TAG" \
            bash scripts/release-guard-tag-version.sh
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - name: Locate matching prebuild run
        id: prebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${{ inputs.prebuilds_run_id }}"
          IFS=$'\t' read -r workflow conclusion actual_workflow_sha < <(
            gh run view "$run_id" \
              --json workflowName,conclusion,headSha \
              --jq '[.workflowName, .conclusion, .headSha] | @tsv'
          )
          if [ "$workflow" != "TypeScript N-API Prebuilds" ] || [ "$conclusion" != success ]; then
            echo "::error::Prebuild run must be a successful TypeScript N-API Prebuilds run"
            exit 1
          fi
          if [ "$actual_workflow_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Prebuild workflow SHA $actual_workflow_sha != $GITHUB_SHA"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download same-commit native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.prebuild.outputs.run_id }}" \
            --name "ts-npm-dir-${{ steps.identity.outputs.commit }}" \
            --dir npm-packages
      - name: Build root package
        working-directory: bindings/typescript/sysprims
        run: |
          npm install --omit=optional
          npm run build
      - name: Pack and attest all eight packages
        run: |
          node scripts/npm-release.mjs stage \
            --stage dist/npm-stage \
            --native-dir npm-packages \
            --root-package bindings/typescript/sysprims \
            --tag "${{ steps.identity.outputs.tag }}" \
            --commit "${{ steps.identity.outputs.commit }}"
          node scripts/npm-release.mjs compare \
            --stage dist/npm-stage \
            --tag "${{ steps.identity.outputs.tag }}" \
            --commit "${{ steps.identity.outputs.commit }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: npm-stage-${{ steps.identity.outputs.commit }}
          path: dist/npm-stage
          if-no-files-found: error
  publish:
    name: Publish attested npm packages
    if: ${{ !inputs.dry_run }}
    needs: stage
    runs-on: ubuntu-latest
    environment: publish-npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.stage.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Ensure trusted publishing npm runtime
        env:
          MIN_TRUSTED_PUBLISH_NODE: '22.14.0'
          MIN_TRUSTED_PUBLISH_NPM: '11.5.1'
        run: |
          npm install -g "npm@${MIN_TRUSTED_PUBLISH_NPM}"
          node -e '
            const got = process.versions.node.split(".").map(Number);
            const min = process.env.MIN_TRUSTED_PUBLISH_NODE.split(".").map(Number);
            if (got[0] < min[0] ||
                (got[0] === min[0] && (got[1] < min[1] ||
                (got[1] === min[1] && got[2] < min[2])))) process.exit(1);
          '
          NPM_VERSION="$(npm --version)" node -e '
            const got = process.env.NPM_VERSION.split(".").map(Number);
            const min = process.env.MIN_TRUSTED_PUBLISH_NPM.split(".").map(Number);
            if (got[0] < min[0] ||
                (got[0] === min[0] && (got[1] < min[1] ||
                (got[1] === min[1] && got[2] < min[2])))) process.exit(1);
          '
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: npm-stage-${{ needs.stage.outputs.commit }}
          path: dist/npm-stage
      - name: Verify and resumably publish attested bytes
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-oidc"
          printf '%s\n' \
            'registry=https://registry.npmjs.org/' \
            'always-auth=false' \
            > "$NPM_CONFIG_USERCONFIG"
          node scripts/npm-release.mjs verify \
            --stage dist/npm-stage \
            --tag "${{ needs.stage.outputs.tag }}" \
            --commit "${{ needs.stage.outputs.commit }}"
          node scripts/npm-release.mjs publish \
            --stage dist/npm-stage \
            --tag "${{ needs.stage.outputs.tag }}" \
            --commit "${{ needs.stage.outputs.commit }}"
