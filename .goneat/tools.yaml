# goneat Tools Configuration (v1.0.0)
# sysprims - GPL-free process utilities library
#
# This file is the SINGLE SOURCE OF TRUTH for tools configuration.
# There are NO hidden defaults or runtime merging.
#
# Edit this file to:
# - Add/remove tools
# - Change tool detection commands
# - Modify installer priorities
# - Define custom scopes
#
# Validate changes with: goneat doctor tools validate
# See schema: schemas/tools/tools.v1.0.0.json
scopes:
  # make bootstrap installs only this scope: exact pins via go install or a
  # reviewed cargo command, never a package manager. Installing other scopes
  # can fetch package managers (brew, bun), so bootstrap only checks them.
  bootstrap:
    description: Exact-pinned tools installed by make bootstrap (go install or cargo install only)
    tools:
      - checkmake
      - yamlfmt
      - actionlint
      - gitleaks
      - cargo-deny
      - cargo-audit
      - cargo-edit
      - cargo-nextest
      - cbindgen
  all:
    description: All tools from all scopes
    tools:
      # Foundation
      - checkmake
      - ripgrep
      - jq
      - yq
      - yamlfmt
      - yamllint
      - prettier
      - actionlint
      # Rust
      - cargo-deny
      - cargo-audit
      - cargo-edit
      - cargo-nextest
      - cbindgen
      # Languages (bindings)
      - go
      - uv
      - bun
      # Security
      - gitleaks
      - syft
      - grype
      # CI/CD
      - act
  foundation:
    description: Core foundation tools required for goneat and basic AI agent operation
    tools:
      - checkmake
      - ripgrep
      - jq
      - yq
      - yamlfmt
      - yamllint
      - prettier
      - actionlint
  rust:
    description: Rust development and quality tools
    tools:
      - cargo-deny
      - cargo-audit
      - cargo-edit
      - cargo-nextest
      - cbindgen
  bindings:
    description: Language toolchains for FFI bindings (Go, Python, TypeScript)
    tools:
      - go
      - uv
      - bun
  security:
    description: Security scanning tools
    tools:
      - gitleaks
      - cargo-audit
      - cargo-deny
  sbom:
    description: Software Bill of Materials (SBOM) and vulnerability scanning tools
    tools:
      - syft
      - grype
  cicd:
    description: CI/CD testing tools
    tools:
      - act
tools:
  # ==========================================================================
  # Foundation Tools
  # ==========================================================================
  checkmake:
    name: checkmake
    description: Makefile linter
    kind: go
    detect_command: checkmake -v
    install_package: github.com/mrtazz/checkmake/cmd/checkmake@v0.3.2
    # Cooling checks this exact pin, not upstream latest.
    recommended_version: 0.3.2
    version_scheme: semver
    version_args:
      - -v
    check_args:
      - -h
    installer_priority:
      all:
        - go-install
  ripgrep:
    name: ripgrep
    description: Fast text search - used by goneat for license auditing
    kind: system
    detect_command: rg --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - brew
      linux:
        - brew
      windows:
        - scoop
        - winget
  jq:
    name: jq
    description: JSON processor - used in CI/CD scripts and cargo metadata parsing
    kind: system
    detect_command: jq --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - brew
      linux:
        - brew
      windows:
        - scoop
        - winget
  yq:
    name: yq
    description: YAML processor
    kind: system
    detect_command: yq --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - brew
      linux:
        - brew
      windows:
        - scoop
        - winget
  yamlfmt:
    name: yamlfmt
    description: YAML formatter
    kind: go
    detect_command: yamlfmt --version
    install_package: github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
    # Cooling checks this exact pin, not upstream latest.
    recommended_version: 0.21.0
    version_scheme: semver
    version_args:
      - --version
    check_args:
      - --help
    installer_priority:
      all:
        - go-install
  yamllint:
    name: yamllint
    description: YAML linter
    kind: system
    detect_command: yamllint --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      all:
        - manual
    install_commands:
      manual: uv tool install yamllint
  prettier:
    name: prettier
    description: Opinionated code formatter for markdown and JSON
    kind: node
    detect_command: prettier --version
    installer_priority:
      darwin:
        - brew
      linux:
        - brew
      windows:
        - bun
        - npm
  actionlint:
    name: actionlint
    description: GitHub Actions workflow linter
    kind: go
    detect_command: actionlint -version
    install_package: github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
    # Cooling checks this exact pin, not upstream latest.
    recommended_version: 1.7.12
    version_scheme: semver
    version_args:
      - -version
    check_args:
      - -h
    installer_priority:
      all:
        - go-install
  # ==========================================================================
  # Rust Tools
  # ==========================================================================
  # Declared as kind: system with a manual cargo command so that detection uses
  # detect_command (cargo-edit has no cargo-edit binary) and installs keep
  # --locked and an exact version; goneat's kind: cargo path drops both. Each
  # detect_command names the tool's own binary, so a missing tool fails to
  # start instead of printing a cargo error that would read as present.
  # goneat cannot read crates.io release ages, so cooling is alert-only here;
  # the exact --version pin is the control and changes through review.
  # These are developer tools built by the host's stable toolchain, not the
  # library's MSRV (Cargo.toml rust-version): cargo-nextest 0.9.128 needs 1.89.
  cargo-deny:
    name: cargo-deny
    description: Cargo plugin for license and advisory checks (ADR-0001, ADR-0006)
    kind: system
    detect_command: cargo-deny --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - manual
      linux:
        - manual
      windows:
        - manual
    install_commands:
      manual: cargo install cargo-deny --locked --version 0.20.2
    cooling:
      enabled: true
      alert_only: true
  cargo-audit:
    name: cargo-audit
    description: Cargo plugin for security vulnerability auditing
    kind: system
    detect_command: cargo-audit --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - manual
      linux:
        - manual
      windows:
        - manual
    install_commands:
      manual: cargo install cargo-audit --locked --version 0.22.0
    cooling:
      enabled: true
      alert_only: true
  cargo-edit:
    name: cargo-edit
    description: Cargo plugin for version management (cargo set-version)
    kind: system
    detect_command: cargo-set-version set-version -V
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - manual
      linux:
        - manual
      windows:
        - manual
    install_commands:
      manual: cargo install cargo-edit --locked --version 0.13.8
    cooling:
      enabled: true
      alert_only: true
  cargo-nextest:
    name: cargo-nextest
    description: Next-generation Cargo test runner (faster, better output)
    kind: system
    detect_command: cargo-nextest --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - manual
      linux:
        - manual
      windows:
        - manual
    install_commands:
      manual: cargo install cargo-nextest --locked --version 0.9.128
    cooling:
      enabled: true
      alert_only: true
  cbindgen:
    name: cbindgen
    description: Generate C headers from Rust FFI code (version matches CI CBINDGEN_VERSION)
    kind: system
    detect_command: cbindgen --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - manual
      linux:
        - manual
      windows:
        - manual
    install_commands:
      manual: cargo install cbindgen --locked --version 0.29.2
    cooling:
      enabled: true
      alert_only: true
  # ==========================================================================
  # Language Toolchains (for bindings)
  # ==========================================================================
  go:
    name: go
    description: Go toolchain - required for Go bindings
    kind: system
    detect_command: go version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - brew
      linux:
        - brew
      windows:
        - scoop
        - winget
    version_scheme: semver
    minimum_version: 1.21.0
    recommended_version: 1.23.0
  uv:
    name: uv
    description: Fast Python package installer - required for Python bindings
    kind: system
    detect_command: uv --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - brew
      linux:
        - brew
      windows:
        - scoop
  bun:
    name: bun
    description: Fast JavaScript runtime - required for TypeScript bindings
    kind: system
    detect_command: bun --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - brew
      linux:
        - manual
      windows:
        - scoop
    install_commands:
      manual: curl -fsSL https://bun.sh/install | bash
  # ==========================================================================
  # Security Tools
  # ==========================================================================
  gitleaks:
    name: gitleaks
    description: Git secrets scanner
    kind: go
    detect_command: gitleaks version
    install_package: github.com/zricethezav/gitleaks/v8@v8.30.1
    # Cooling checks this exact pin, not upstream latest.
    recommended_version: 8.30.1
    version_scheme: semver
    version_args:
      - version
    check_args:
      - help
    installer_priority:
      all:
        - go-install
  syft:
    name: syft
    description: SBOM generator for software supply chain security
    kind: system
    detect_command: syft version
    version_args:
      - version
    check_args:
      - --help
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - brew
      linux:
        - brew
      windows:
        - scoop
  grype:
    name: grype
    description: Vulnerability scanner for container images and filesystems
    kind: system
    detect_command: grype version
    version_args:
      - version
    check_args:
      - --help
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - brew
      linux:
        - brew
      windows:
        - scoop
  # ==========================================================================
  # CI/CD Tools
  # ==========================================================================
  act:
    name: act
    description: Run GitHub Actions locally
    kind: system
    detect_command: act --version
    platforms:
      - darwin
      - linux
      - windows
    installer_priority:
      darwin:
        - brew
      linux:
        - brew
      windows:
        - scoop
