# goneat assess configuration for sysprims
# Rust project with FFI bindings
#
# goneat is the DX and hook entry point. Rust formatting and linting remain
# delegated to rustfmt and clippy through the Makefile and CI. Biome owns
# JavaScript/TypeScript formatting through the package-local biome.json, while
# goneat owns formatter discovery, check/fix mode, and unified reporting.
#
# This config primarily scopes additional non-Rust lint checks.
# Keep comments current with the installed goneat release.
version: 1
# Rust toolchain checks - FUTURE (goneat v0.4.1+)
# rust:
#   fmt:
#     enabled: true
#     fix: true
#   clippy:
#     enabled: true
#     deny_warnings: true
#   deny:
#     enabled: true
#     checks: [licenses, advisories, bans, sources]
#   paths:
#     - "crates/**/*.rs"
#     - "ffi/**/*.rs"
#   ignore:
#     - "**/target/**"
lint:
  # YAML linting (CI workflows, configs)
  yamllint:
    enabled: true
    strict: true
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".goneat/**/*.yaml"
    ignore: []
  # Go linting note:
  # goneat currently runs golangci-lint from the repo root. To support that while keeping
  # Go bindings in a submodule, we include:
  # - a minimal root go.mod
  # - a root go.work referencing bindings/go/sysprims
  # - a tiny placeholder Go package (internal/gowork) so repo-root ./... resolves
  #
  # CI still runs Go tests from bindings/go/sysprims directly.

  # Shell script linting
  shell:
    shfmt:
      enabled: true
      fix: false
    shellcheck:
      enabled: false
      path: ""
    paths:
      - "**/*.sh"
      - "scripts/**/*.sh"
    ignore:
      - "**/target/**"
      - "**/.git/**"
  # GitHub Actions linting
  github_actions:
    actionlint:
      enabled: true
      paths:
        - ".github/workflows/**/*.yml"
        - ".github/workflows/**/*.yaml"
      ignore: []
  # Makefile linting
  make:
    checkmake:
      enabled: true
      config:
        max_body_length: 75  # Bootstrap/tools targets can be complex
        min_phony_targets:
          - all
          - clean
          - test
          - check
          - build
    paths:
      - "**/Makefile"
    ignore: []
