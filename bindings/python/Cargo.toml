# The Python extension module. A workspace of its own, outside crates/, so it
# is never a release crate: pyo3 stays out of the published crates' graph and
# the release-source checks see only crates/.
[package]
name = "sysprims-py"
version = "0.3.0"
edition = "2021"
rust-version = "1.88.0"
description = "CPython abi3 extension module for sysprims"
license = "MIT OR Apache-2.0"
repository = "https://github.com/3leaps/sysprims"
publish = false
build = false

[lib]
name = "_sysprims"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", default-features = false, features = ["macros", "extension-module", "abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysprims-core = { path = "../../crates/sysprims-core" }
sysprims-proc = { path = "../../crates/sysprims-proc" }
sysprims-recurrence = { path = "../../crates/sysprims-recurrence" }
sysprims-session = { path = "../../crates/sysprims-session" }
sysprims-signal = { path = "../../crates/sysprims-signal" }
sysprims-timeout = { path = "../../crates/sysprims-timeout" }

[lints.rust]
unsafe_code = "forbid"

[workspace]
