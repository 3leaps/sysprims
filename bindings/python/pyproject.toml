[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "sysprims"
version = "0.3.0"
description = "Cross-platform process inspection, signal dispatch, containment, timeout, and RFC 5545 recurrence primitives"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
keywords = ["process", "signals", "timeout", "containment", "rrule", "recurrence"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.urls]
Repository = "https://github.com/3leaps/sysprims"

[tool.maturin]
python-source = "python"
module-name = "sysprims._sysprims"
features = []

# maturin's Rust SBOM records path dependencies as absolute file:// URLs of
# the build host. The release ships its own SBOM (sbom-<version>.cdx.json) for
# the tagged commit, so the wheel carries none.
[tool.maturin.sbom]
rust = false
